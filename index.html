<!doctype html>
<html lang="ru" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Финансы</title>
    <meta name="description" content="Личные финансы: баланс, денежный поток, цели и стратег." />
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS: запуск с экрана «Домой» без интерфейса Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Финансы" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />

    <!-- тема до первой отрисовки: без вспышки светлого фона (ключ — ThemeContext.jsx) -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('tenge-finance.theme') || '"obsidian"');
        if (t !== 'alabaster') t = 'obsidian';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'alabaster') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f4f0');
      } catch (e) {}
    </script>
    <style>
      html, body { background: #050507; }
      html[data-theme='alabaster'], html[data-theme='alabaster'] body { background: #f5f4f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
